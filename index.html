<body>
  <div class="wiki-container">
    <header class="wiki-header">
      <div class="wiki-title">
        <span>2026/9/8 HOMEWORK</span>
        <small>yxhomework</small>
      </div>
      <div class="wiki-subtitle">
        Powered by yhzakioi
      </div>
    </header>

    <main class="wiki-body">
      <h1 id="98-homework">9/8 HOMEWORK</h1>
      <h2 id="_1">语文</h2>
      <ol>
        <li>伴你学夹册一单元（周五交）</li>
        <li>伴你学《草原》（周四交（? ）</li>
      </ol>
    </main>

    <section class="submit-section">
      <h3>提交作业更新申请</h3>
      <p style="color: #555; margin-bottom: 1rem; font-size: 0.95rem;">
        在下方输入你想添加的作业内容，提交后会自动追加到页面末尾。
      </p>
      <form id="updateForm">
        <label for="newContent">新内容（支持HTML标签）</label>
        <textarea id="newContent" placeholder="例如：&lt;li&gt;数学：练习册第10页&lt;/li&gt;"></textarea>
        <div class="btn-group">
          <button type="submit" class="btn-submit" id="submitBtn">提交更新</button>
          <span id="statusMessage" class="btn-status" style="display: none;"></span>
        </div>
        <div class="hint">提交的内容会追加到页面现有内容的末尾，不会覆盖原有内容。</div>
      </form>
    </section>

    <footer class="wiki-footer">
      <span>2026-09-08 · Powered by yhzakioi</span>
    </footer>
  </div>

  <script>
    (function() {
      const GITHUB_TOKEN = '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';
      const OWNER = 'hongzhengyang';
      const REPO = 'yxhomework';
      const FILE_PATH = 'index.html';

      const form = document.getElementById('updateForm');
      const textarea = document.getElementById('newContent');
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');

      function setStatus(text, type) {
        statusMsg.style.display = 'inline-flex';
        statusMsg.textContent = text;
        statusMsg.className = 'btn-status ' + type;
      }

      function hideStatus() {
        statusMsg.style.display = 'none';
      }

      async function updateIndexHtml(newContent) {
        const apiBase = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;

        try {
          const getRes = await fetch(apiBase, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
          });

          if (!getRes.ok) {
            throw new Error(`获取文件失败 (HTTP ${getRes.status})`);
          }

          const fileData = await getRes.json();
          const sha = fileData.sha;
          const currentContent = decodeURIComponent(escape(atob(fileData.content)));

          const updatedContent = currentContent + '\n' + newContent;

          const payload = {
            message: '通过页面提交申请，追加了作业内容',
            content: btoa(unescape(encodeURIComponent(updatedContent))),
            sha: sha
          };

          const putRes = await fetch(apiBase, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${GITHUB_TOKEN}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (!putRes.ok) {
            const errData = await putRes.json();
            throw new Error(`更新失败 (HTTP ${putRes.status}): ${errData.message || '未知错误'}`);
          }

          return { success: true };
        } catch (error) {
          return { success: false, error: error.message };
        }
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const content = textarea.value.trim();
        if (!content) {
          setStatus('请填写要更新的内容', 'error');
          return;
        }

        if (!confirm('确认要追加内容到 index.html 吗？')) {
          return;
        }

        submitBtn.disabled = true;
        setStatus('提交中...', 'loading');

        const result = await updateIndexHtml(content);

        if (result.success) {
          setStatus('提交成功！页面将在1-2分钟后更新', 'success');
          textarea.value = '';
          setTimeout(() => {
            if (confirm('更新已提交，是否立即刷新页面查看效果？')) {
              location.reload();
            }
          }, 3000);
        } else {
          setStatus('失败：' + result.error, 'error');
        }

        submitBtn.disabled = false;
      });

      textarea.addEventListener('input', hideStatus);
    })();
  </script>
